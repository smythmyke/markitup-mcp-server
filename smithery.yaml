# Smithery configuration — https://smithery.ai/docs/build/project-config/smithery.yaml
#
# markitup-mcp-server is a stdio server distributed via npm. Smithery launches it
# via `npx -y markitup-mcp-server` and passes the user's API key as an env var.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - markitupApiKey
    properties:
      markitupApiKey:
        type: string
        title: MarkItUp API Key
        description: API key from your MarkItUp dashboard at https://markitup.app/dashboard/api-keys. Format mk_live_... or mk_test_...
      markitupApiBase:
        type: string
        title: API Base URL (optional)
        description: Override the API base. Default https://markitup.app/api/v1
        default: https://markitup.app/api/v1
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'markitup-mcp-server'],
      env: {
        MARKITUP_API_KEY: config.markitupApiKey,
        ...(config.markitupApiBase ? { MARKITUP_API_BASE: config.markitupApiBase } : {})
      }
    })
